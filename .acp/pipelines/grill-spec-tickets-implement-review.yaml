version: 3
id: grill-spec-tickets-implement-review
title: Grill with Docs → Spec Docs → Ticket Docs → Sequential Implement → Review

nodes:
  - id: plan
    agent: Vibe
    skills: [grill-with-docs, grilling, domain-modeling]
    interaction:
      protocol: proposed-plan
      repairAttempts: 3
    promptFile: ../agents/interactive-planner.md
    prompt: |
      User request:
      {{userPrompt}}
    policy:
      filesystem: workspace-write
      terminal: none
      network: disabled
      promotion: auto-apply
    output:
      name: plan
      type: acp.grill-decision/v1
      format: markdown

  - id: plan_approval
    type: pause
    pause: approval
    content: |
      <!-- acp-cli:documentation-only-before-approval -->
      {{inputs.plan}}
    format: proposed-plan
    needs: [plan]
    inputs:
      - name: plan
        from: plan.plan
        type: acp.grill-decision/v1
        format: markdown
    output:
      name: approved
      type: acp.grill-decision/v1
      format: markdown

  - id: spec
    agent: Vibe
    skills: [to-spec, domain-modeling]
    promptFile: ../agents/matt-spec-writer.md
    prompt: |
      User request:
      {{userPrompt}}

      Approved decisions:
      {{inputs.approvedDecisions}}
    needs: [plan_approval]
    inputs:
      - name: approvedDecisions
        from: plan_approval.approved
        type: acp.grill-decision/v1
        format: markdown
    policy:
      filesystem: workspace-write
      terminal: none
      network: disabled
      promotion: auto-apply
    output:
      name: specification
      type: acp.workspace-files/v1
      format: markdown

  - id: tasks
    agent: Vibe
    skills: [to-tickets]
    promptFile: ../agents/matt-ticket-planner.md
    prompt: |
      User request:
      {{userPrompt}}

      Specification files:
      {{inputs.specification}}
    needs: [spec]
    inputs:
      - name: specification
        from: spec.specification
        type: acp.workspace-files/v1
        format: markdown
    policy:
      filesystem: workspace-write
      terminal: none
      network: disabled
      promotion: auto-apply
    output:
      name: tickets
      type: acp.workspace-files/v1
      format: markdown

  - id: delivery_approval
    type: pause
    pause: approval
    content: |
      <!-- acp-cli:require-workspace-files=2 -->
      <!-- acp-cli:workspace-layout=delivery -->
      <!-- acp-cli:documentation-only-before-approval -->
      <proposed_plan>
      <interview_state>ready</interview_state>

      ## Specification files

      {{inputs.specification}}

      ## Ticket files

      {{inputs.tickets}}
      </proposed_plan>
    format: proposed-plan
    needs: [tasks]
    inputs:
      - name: specification
        from: spec.specification
        type: acp.workspace-files/v1
        format: markdown
      - name: tickets
        from: tasks.tickets
        type: acp.workspace-files/v1
        format: markdown
    output:
      name: approved
      type: acp.workspace-files/v1
      format: markdown

  - id: implementation
    agent: Vibe
    promptFile: ../agents/matt-implementer.md
    prompt: |
      User request:
      {{userPrompt}}

      Approved delivery files:
      {{inputs.delivery}}
    needs: [delivery_approval]
    inputs:
      - name: delivery
        from: delivery_approval.approved
        type: acp.workspace-files/v1
        format: markdown
    policy:
      filesystem: workspace-write
      terminal: workspace-write
      network: disabled
      promotion: auto-apply
    output:
      name: result
      type: acp.ticket-sequence-result/v1
      format: markdown

  - id: review
    agent: Vibe
    skills: [code-review]
    promptFile: ../agents/matt-plan-reviewer.md
    prompt: |
      User request:
      {{userPrompt}}

      Approved delivery files:
      {{inputs.delivery}}
    needs: [implementation]
    inputs:
      - name: delivery
        from: delivery_approval.approved
        type: acp.workspace-files/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: workspace-write
      network: disabled
      promotion: discard
    output:
      name: report
      type: acp.verification-report/v1
      format: markdown
