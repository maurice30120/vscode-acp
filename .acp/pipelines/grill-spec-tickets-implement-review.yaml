version: 3
id: grill-spec-tickets-implement-review
title: Grill → Spec → Tickets → Implement → Review

nodes:
  - id: plan
    # Agents disponibles :
    agent: Codex CLI
    # agent: Vibe
    # agent: Cursor CLI
    # agent: OpenCode
    # agent: Pi Agent
    # agent: Codex Sandcastle
    # agent: Cursor Sandcastle
    # agent: Pi Sandcastle
    # agent: Vibe Sandcastle
    skills:
      - grill-me
      - grilling
    interaction:
      protocol: proposed-plan
      repairAttempts: 1
    promptFile: ../agents/interactive-planner.md
    prompt: |
      Resolve one user decision at a time. Recommend an answer with a short
      justification. Inspect the workspace for facts instead of asking about
      them. Preserve confirmed decisions and never modify files. Do not declare
      the plan ready until every material question is answered.

      User request:
      {{userPrompt}}
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: plan
      type: acp.grill-decision/v1
      format: markdown

  - id: plan_approval
    type: pause
    pause: approval
    content: "{{inputs.plan}}"
    format: proposed-plan
    needs: [plan]
    inputs:
      - name: plan
        from: plan.plan
        type: acp.grill-decision/v1
        format: markdown
    output:
      name: approved
      type: acp.grill-decision/v1
      format: markdown

  - id: spec
    # Agents disponibles :
    agent: Codex CLI
    # agent: Vibe
    # agent: Cursor CLI
    # agent: OpenCode
    # agent: Pi Agent
    # agent: Codex Sandcastle
    # agent: Cursor Sandcastle
    # agent: Pi Sandcastle
    # agent: Vibe Sandcastle
    skills: [to-spec]
    promptFile: ../agents/matt-spec-writer.md
    prompt: |
      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}

      Synthesize the approved decisions into the complete specification now.
    needs: [plan_approval]
    inputs:
      - name: approvedPlan
        from: plan_approval.approved
        type: acp.grill-decision/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: specification
      type: acp.specification/v1
      format: markdown

  - id: tasks
    # Agents disponibles :
    agent: Codex CLI
    # agent: Vibe
    # agent: Cursor CLI
    # agent: OpenCode
    # agent: Pi Agent
    # agent: Codex Sandcastle
    # agent: Cursor Sandcastle
    # agent: Pi Sandcastle
    # agent: Vibe Sandcastle
    skills: [to-tickets]
    promptFile: ../agents/matt-ticket-planner.md
    prompt: |
      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}

      Specification:
      {{inputs.specification}}

      Produce the ordered tracer-bullet task plan now.
    needs: [spec]
    inputs:
      - name: approvedPlan
        from: plan_approval.approved
        type: acp.grill-decision/v1
        format: markdown
      - name: specification
        from: spec.specification
        type: acp.specification/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: tickets
      type: acp.ticket-graph/v1
      format: markdown

  - id: delivery_approval
    type: pause
    pause: approval
    content: |
      <proposed_plan>
      <interview_state>ready</interview_state>

      ## Specification

      {{inputs.specification}}

      ## Task plan

      {{inputs.tickets}}
      </proposed_plan>
    format: proposed-plan
    needs: [tasks]
    inputs:
      - name: specification
        from: spec.specification
        type: acp.specification/v1
        format: markdown
      - name: tickets
        from: tasks.tickets
        type: acp.ticket-graph/v1
        format: markdown
    output:
      name: approved
      type: acp.ticket-graph/v1
      format: markdown

  - id: implementation
    # Agents disponibles :
    # agent: Codex CLI
    # agent: Vibe
    # agent: Cursor CLI
    # agent: OpenCode
    # agent: Pi Agent
    # agent: Codex Sandcastle
    # agent: Cursor Sandcastle
    # agent: Pi Sandcastle
    agent: Vibe Sandcastle

    skills: [implement, tdd]
    promptFile: ../agents/matt-implementer.md
    prompt: |
      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}

      Approved specification:
      {{inputs.specification}}

      Approved task plan:
      {{inputs.approvedTickets}}

      Implement the complete approved task plan in dependency order.
    needs: [delivery_approval]
    inputs:
      - name: approvedPlan
        from: plan_approval.approved
        type: acp.grill-decision/v1
        format: markdown
      - name: specification
        from: spec.specification
        type: acp.specification/v1
        format: markdown
      - name: approvedTickets
        from: delivery_approval.approved
        type: acp.ticket-graph/v1
        format: markdown
    policy:
      filesystem: workspace-write
      terminal: workspace-write
      network: enabled
      promotion: auto-apply
    output:
      name: result
      type: acp.implementation-result/v1
      format: markdown

  - id: review
    # Agents disponibles :
    agent: Codex CLI
    # agent: Vibe
    # agent: Cursor CLI
    # agent: OpenCode
    # agent: Pi Agent
    # agent: Codex Sandcastle
    # agent: Cursor Sandcastle
    # agent: Pi Sandcastle
    # agent: Vibe Sandcastle
    # agent: Pi Agent
    skills: [code-review]
    promptFile: ../agents/matt-plan-reviewer.md
    prompt: |
      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}

      Approved specification:
      {{inputs.specification}}

      Approved task plan:
      {{inputs.approvedTickets}}

      Implementation report:
      {{inputs.implementation}}

      Review the actual workspace diff against all approved artifacts.
    needs: [implementation]
    inputs:
      - name: approvedPlan
        from: plan_approval.approved
        type: acp.grill-decision/v1
        format: markdown
      - name: specification
        from: spec.specification
        type: acp.specification/v1
        format: markdown
      - name: approvedTickets
        from: delivery_approval.approved
        type: acp.ticket-graph/v1
        format: markdown
      - name: implementation
        from: implementation.result
        type: acp.implementation-result/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: report
      type: acp.verification-report/v1
      format: markdown
