version: 3
id: plan-execute-verify
title: Plan Execute Verify

nodes:
  - id: plan
    # Agents disponibles :
    # agent: Codex CLI
    # agent: Vibe
    # agent: Cursor CLI
    # agent: OpenCode
    # agent: Pi Agent
    # agent: Codex Sandcastle
    # agent: Cursor Sandcastle
    # agent: Pi Sandcastle
    # agent: Vibe Sandcastle
    agent: Vibe
    instructionsFile: ../agents/planner.md
    prompt: |
      Create a decision-complete implementation plan only.
      Return exactly one <proposed_plan>...</proposed_plan> block.
      Include likely code areas to change (file paths, modules, or search targets),
      concrete implementation steps, validation commands, and acceptance criteria.

      User request:
      {{userPrompt}}
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: plan
      type: acp.proposed-plan/v1
      format: markdown

  - id: approval
    type: pause
    pause: approval
    content: "{{inputs.plan}}"
    format: proposed-plan
    needs:
      - plan
    inputs:
      - name: plan
        from: plan.plan
        type: acp.proposed-plan/v1
        format: markdown
    output:
      name: approved
      type: acp.approval/v1
      format: markdown

  - id: implement
    # Agents disponibles :
    # agent: Codex CLI
    # agent: Vibe
    # agent: Cursor CLI
    # agent: OpenCode
    # agent: Pi Agent
    # agent: Codex Sandcastle
    # agent: Cursor Sandcastle
    # agent: Pi Sandcastle
    # agent: Vibe Sandcastle
    agent: Vibe Sandcastle
    instructionsFile: ../agents/implementer.md
    prompt: |
      Implement the approved plan in the current workspace.
      Make the required workspace changes; do not stop after inventory or analysis.
      If implementation is impossible, explain the blocker and name the files or missing facts.
      Before finishing, inspect the diff and summarize changed files plus validation run.

      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}
    needs:
      - approval
    inputs:
      - name: approvedPlan
        from: approval.approved
        type: acp.approval/v1
        format: markdown
    policy:
      filesystem: workspace-write
      terminal: workspace-write
      network: disabled
      promotion: auto-apply
    output:
      name: result
      type: acp.implementation-result/v1
      format: markdown

  - id: verify
    # Agents disponibles :
    # agent: Codex CLI
    # agent: Vibe
    # agent: Cursor CLI
    # agent: OpenCode
    # agent: Pi Agent
    # agent: Codex Sandcastle
    # agent: Cursor Sandcastle
    # agent: Pi Sandcastle
    # agent: Vibe Sandcastle
    agent: Vibe
    instructionsFile: ../agents/reviewer.md
    prompt: |
      Verify whether the approved plan was completed.
      Include changed files, tests, risks, and remaining gaps.

      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}

      Implementation output:
      {{inputs.implementation}}
    needs:
      - implement
    inputs:
      - name: approvedPlan
        from: approval.approved
        type: acp.approval/v1
        format: markdown
      - name: implementation
        from: implement.result
        type: acp.implementation-result/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: report
      type: acp.verification-report/v1
      format: markdown
