name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Test shared packages
        run: npm run test:common

      - name: Test VS Code extension
        run: xvfb-run -a npm run test:vscode
        if: runner.os == 'Linux'

      - name: Test VS Code extension
        run: npm run test:vscode
        if: runner.os != 'Linux'

      - name: Test Pi extension
        run: npm run test:pi

      - name: Package VSIX
        run: npm run vsx

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: "*.vsix"

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --silent

      - name: Test ACP CLI
        shell: bash
        run: |
          if ! npm run test:cli > acp-cli-test.log 2>&1; then
            tail -n 100 acp-cli-test.log
            exit 1
          fi
          tail -n 40 acp-cli-test.log

      - name: Upload ACP CLI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-cli-test-${{ matrix.os }}
          path: acp-cli-test.log
