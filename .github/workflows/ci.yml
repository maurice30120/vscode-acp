name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Test shared packages
        run: npm run test:common

      - name: Compile VS Code tests
        run: npm run compile-tests -w acp-client

      - name: Compile VS Code extension
        run: npm run compile -w acp-client

      - name: Lint VS Code extension
        run: npm run lint -w acp-client

      - name: Test VS Code extension
        run: cd plugin-vscode && xvfb-run -a npx vscode-test
        if: runner.os == 'Linux'

      - name: Test VS Code extension
        run: cd plugin-vscode && npx vscode-test
        if: runner.os != 'Linux'

      - name: Test Pi extension
        run: npm run test:pi

      - name: Package VSIX
        run: npm run vsx

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: "*.vsix"

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --silent

      - name: Test ACP CLI
        run: npm run test:cli
