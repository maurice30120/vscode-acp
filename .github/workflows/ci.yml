name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-catalog-fixture:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/interactive-grill-skeleton-tdd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Include the Matt pipeline in the embedded catalog expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('plugin-pi/test/configCatalog.test.ts')
          content = path.read_text()
          old = '["async-use-case-review", "grill-skeleton-tdd", "plan-execute-verify", "vibe"]'
          new = '''[
          \t\t\t"async-use-case-review",
          \t\t\t"grill-skeleton-tdd",
          \t\t\t"grill-spec-tickets-implement-review",
          \t\t\t"plan-execute-verify",
          \t\t\t"vibe",
          \t\t]'''
          if old in content:
              path.write_text(content.replace(old, new))
          elif '"grill-spec-tickets-implement-review"' not in content:
              raise SystemExit('catalog expectation shape changed unexpectedly')
          PY

          if git diff --quiet -- plugin-pi/test/configCatalog.test.ts; then
            echo "Catalog expectation is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin-pi/test/configCatalog.test.ts
          git commit -m "test: include Matt pipeline in embedded catalog"
          git push origin HEAD:${{ github.head_ref }}

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Test shared packages
        run: npm run test:common

      - name: Test VS Code extension
        run: xvfb-run -a npm run test:vscode
        if: runner.os == 'Linux'

      - name: Test VS Code extension
        run: npm run test:vscode
        if: runner.os != 'Linux'

      - name: Test Pi extension
        run: npm run test:pi

      - name: Package VSIX
        run: npm run vsx

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: "*.vsix"

  pi-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --loglevel=error

      - name: Verify local Pi binary
        run: npx pi --version

      - name: Capture Pi extension test output
        shell: bash
        run: |
          set +e
          npm run test:pi > pi-test.log 2>&1
          echo $? > pi-test.status
          tail -n 160 pi-test.log

      - name: Upload Pi diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pi-test-diagnostics
          path: |
            pi-test.log
            pi-test.status
            plugin-pi/test/configCatalog.test.ts

      - name: Fail when Pi tests failed
        shell: bash
        run: |
          status=$(cat pi-test.status)
          exit "$status"
