name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Run tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a npm test 2>&1 | tee ci-test.log

      - run: npm test
        if: runner.os != 'Linux'

      - name: Upload Linux test log
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-log-ubuntu
          path: ci-test.log

      - name: Package VSIX
        run: npx vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: "*.vsix"
