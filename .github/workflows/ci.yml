name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Test shared packages
        run: npm run test:common

      - name: Test VS Code extension
        run: xvfb-run -a npm run test:vscode
        if: runner.os == 'Linux'

      - name: Test VS Code extension
        run: npm run test:vscode
        if: runner.os != 'Linux'

      - name: Test Pi extension
        id: pi_test
        shell: bash
        run: |
          set -o pipefail
          npm run test:pi 2>&1 | tee pi-test-${{ runner.os }}.log
        continue-on-error: true

      - name: Upload Pi test log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-test-log-${{ runner.os }}
          path: pi-test-${{ runner.os }}.log
          if-no-files-found: ignore

      - name: Fail on Pi test error
        shell: bash
        if: steps.pi_test.outcome == 'failure'
        run: exit 1

      - name: Package VSIX
        run: npm run vsx

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: "*.vsix"

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --silent

      - name: Test ACP CLI
        run: npm run test:cli
