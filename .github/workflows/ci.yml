name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Run Linux tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a npm test 2>&1 | tee ci-test.log

      - name: Run macOS tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-test.log

      - name: Run Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath ci-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package VSIX on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          npm run vsx 2>&1 | tee ci-package.log

      - name: Package VSIX on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run vsx 2>&1 | Tee-Object -FilePath ci-package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ matrix.os }}
          path: |
            ci-test.log
            ci-package.log

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: "*.vsix"
