name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Test shared packages
        run: npm run test:common

      - name: Test VS Code extension
        run: xvfb-run -a npm run test:vscode
        if: runner.os == 'Linux'

      - name: Test VS Code extension
        run: npm run test:vscode
        if: runner.os != 'Linux'

      - name: Test Pi extension
        run: npm run test:pi

      - name: Package VSIX
        run: npm run vsx

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: "*.vsix"

  pi-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --loglevel=error

      - name: Verify local Pi binary
        run: npx pi --version

      - name: Test Pi extension with compact failure output
        shell: bash
        run: |
          set +e
          npm run test:pi > pi-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 160 pi-test.log
            exit "$status"
          fi
          cat pi-test.log
