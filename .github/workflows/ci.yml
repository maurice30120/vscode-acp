name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Test shared packages
        run: npm run test:common

      - name: Compile VS Code tests
        run: npm run compile-tests -w acp-client

      - name: Compile VS Code extension
        run: npm run compile -w acp-client

      - name: Lint VS Code extension
        run: npm run lint -w acp-client

      - name: Test VS Code extension
        id: vscode_test_linux
        shell: bash
        run: |
          set -o pipefail
          cd plugin-vscode
          xvfb-run -a npx vscode-test 2>&1 | tee ../vscode-test-${{ runner.os }}.log
        continue-on-error: true
        if: runner.os == 'Linux'

      - name: Test VS Code extension
        id: vscode_test_non_linux
        shell: bash
        run: |
          set -o pipefail
          cd plugin-vscode
          npx vscode-test 2>&1 | tee ../vscode-test-${{ runner.os }}.log
        continue-on-error: true
        if: runner.os != 'Linux'

      - name: Upload VS Code test log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-test-log-${{ runner.os }}
          path: vscode-test-${{ runner.os }}.log
          if-no-files-found: ignore

      - name: Fail on VS Code test error
        shell: bash
        if: steps.vscode_test_linux.outcome == 'failure' || steps.vscode_test_non_linux.outcome == 'failure'
        run: exit 1

      - name: Test Pi extension
        run: npm run test:pi

      - name: Package VSIX
        run: npm run vsx

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: "*.vsix"

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --silent

      - name: Test ACP CLI
        run: npm run test:cli
