name: Temporary Windows portability patch

on:
  push:
    branches:
      - agent/interactive-grill-skeleton-tdd

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interactive-grill-skeleton-tdd

      - name: Apply cross-platform test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def update(path_name, transform):
              path = Path(path_name)
              original = path.read_text(encoding='utf8')
              updated = transform(original)
              if updated == original:
                  return
              path.write_text(updated, encoding='utf8')

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label}: expected text not found')
              return text.replace(old, new, 1)

          def replace_in_section(text, start, end, replacements, label):
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f'{label}: section start not found')
              end_index = text.find(end, start_index)
              if end_index < 0:
                  end_index = len(text)
              section = text[start_index:end_index]
              for old, new in replacements:
                  if new in section:
                      continue
                  if old not in section:
                      raise SystemExit(f'{label}: expected section text not found: {old!r}')
                  section = section.replace(old, new, 1)
              return text[:start_index] + section + text[end_index:]

          update('plugin-vscode/src/test/SessionTreeProvider.test.ts', lambda text: replace_in_section(
              text,
              "  test('returns local sessions when load/resume is available without list', async () => {",
              "  test('agent-sourced list transitions from loading to ready'",
              [
                  (
                      "  test('returns local sessions when load/resume is available without list', async () => {\n    const sm = new FakeSessionManager();",
                      "  test('returns local sessions when load/resume is available without list', async () => {\n    const repo = path.resolve('/repo');\n    const sm = new FakeSessionManager();",
                  ),
                  ("cwdValue === '/repo'", "cwdValue === repo"),
                  ("cwd: '/repo',", "cwd: repo,"),
                  ("      () => '/repo',", "      () => repo,"),
              ],
              'SessionTreeProvider',
          ))

          update('plugin-vscode/src/test/SessionManager.test.ts', lambda text: replace_once(
              text,
              "    assert.deepStrictEqual(upsertCalls[0], ['Plan Execute Verify', '/test', result.sessionId]);",
              "    assert.deepStrictEqual(upsertCalls[0], ['Plan Execute Verify', path.resolve('/test'), result.sessionId]);",
              'SessionManager',
          ))

          def patch_history(text):
              text = replace_once(
                  text,
                  "import * as assert from 'assert';\n",
                  "import * as assert from 'assert';\nimport * as path from 'path';\n",
                  'SessionHistoryStore import',
              )
              text = replace_in_section(
                  text,
                  "  test('upsertNew inserts a new entry and emits change', () => {",
                  "  test('upsertNew on existing session does not duplicate entries'",
                  [
                      ("    assert.strictEqual(entry?.cwd, '/repo');", "    assert.strictEqual(entry?.cwd, path.resolve('/repo'));"),
                      ("    assert.strictEqual(entry?.workspaceKey.endsWith('/repo'), true);", "    assert.strictEqual(store.list('A', path.resolve('/repo')).length, 1);"),
                  ],
                  'SessionHistoryStore upsert',
              )
              text = replace_in_section(
                  text,
                  "  test('enforces cap per agent and workspace', () => {",
                  "  test('markStatus hides missing sessions without deleting them'",
                  [
                      (
                          "  test('enforces cap per agent and workspace', () => {\n    const memento",
                          "  test('enforces cap per agent and workspace', () => {\n    const repoOne = path.resolve('/repo-one');\n    const repoTwo = path.resolve('/repo-two');\n    const memento",
                      ),
                      ("workspaceKey: '/repo-one',", "workspaceKey: repoOne,"),
                      ("cwd: '/repo-one',", "cwd: repoOne,"),
                      ("store.upsertNew('A', '/repo-one', 'one-new');", "store.upsertNew('A', repoOne, 'one-new');"),
                      ("store.upsertNew('A', '/repo-two', 'two-only');", "store.upsertNew('A', repoTwo, 'two-only');"),
                      ("store.list('A', '/repo-one')", "store.list('A', repoOne)"),
                      ("store.list('A', '/repo-two')", "store.list('A', repoTwo)"),
                  ],
                  'SessionHistoryStore cap',
              )
              return text

          update('plugin-vscode/src/test/SessionHistoryStore.test.ts', patch_history)

          def patch_editor(text):
              text = replace_in_section(
                  text,
                  "  test('getActiveTabFilePath returns active tab file path', () => {",
                  "  test('captureEditorContextFromOpenDocument builds context from an open document'",
                  [
                      (
                          "    assert.strictEqual(getActiveTabFilePath(tabGroups), filePath);",
                          "    assert.strictEqual(getActiveTabFilePath(tabGroups), vscode.Uri.file(filePath).fsPath);",
                      ),
                  ],
                  'EditorContext active tab',
              )
              text = replace_in_section(
                  text,
                  "  test('getEditorContextSnapshot uses last known context when editor focus is lost', () => {",
                  "});\n",
                  [
                      (
                          "    const filePath = workspacePath('src', 'remembered.ts');",
                          "    const filePath = vscode.Uri.file(workspacePath('src', 'remembered.ts')).fsPath;",
                      ),
                  ],
                  'EditorContext memory',
              )
              return text

          update('plugin-vscode/src/test/EditorContext.test.ts', patch_editor)

          for path_name in [
              'plugin-vscode/src/test/sandcastle/WorktreePromotion.test.ts',
              'plugin-vscode/src/test/sandcastle/SandcastleAcpAgent.test.ts',
          ]:
              update(path_name, lambda text, path_name=path_name: replace_once(
                  text,
                  "    fs.rmSync(repo, { recursive: true, force: true });",
                  "    fs.rmSync(repo, { recursive: true, force: true, maxRetries: 5, retryDelay: 100 });",
                  path_name,
              ))
          PY

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin-vscode/src/test
          git commit -m "test: make VS Code fixtures portable on Windows"
          git push origin HEAD:agent/interactive-grill-skeleton-tdd
