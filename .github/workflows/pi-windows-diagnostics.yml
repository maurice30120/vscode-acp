name: Pi Windows path repair

on:
  push:
    branches:
      - agent/harmonize-pipeline-artifact-publishing

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harmonize-pipeline-artifact-publishing

      - name: Normalize the cross-platform path assertion
        shell: pwsh
        run: |
          $file = 'plugin-pi/test/configCatalog.test.ts'
          $content = [System.IO.File]::ReadAllText($file)
          $old = 'assert.equal(config.filePath, `${workspace}/.acp/acp-agents.json`);'
          $new = 'assert.equal(config.filePath.replaceAll("\", "/"), `${workspace.replaceAll("\", "/")}/.acp/acp-agents.json`);'
          if (-not $content.Contains($old)) {
            Write-Host 'Path assertion is already normalized.'
            exit 0
          }
          $content = $content.Replace($old, $new)
          [System.IO.File]::WriteAllText($file, $content, [System.Text.UTF8Encoding]::new($false))
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $file
          git commit -m "test(pi): normalize config path assertion"
          git push origin HEAD:agent/harmonize-pipeline-artifact-publishing
