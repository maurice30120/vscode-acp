version: 3
id: async-use-case-review
title: Async Use Case Review

nodes:
  - id: cadrage
    agent: Codex CLI
    prompt: |
      Resume la demande utilisateur en trois points courts :
      - objectif
      - contraintes explicites
      - livrable attendu

      Demande utilisateur :
      {{userPrompt}}
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: summary
      type: acp.analysis/v1
      format: markdown

  - id: analyse_produit
    agent: Codex CLI
    prompt: |
      Analyse le use case cote produit.
      Ne modifie aucun fichier.

      Retourne :
      - valeur utilisateur
      - workflow cible
      - questions ouvertes

      Demande utilisateur :
      {{userPrompt}}

      Cadrage :
      {{inputs.cadrage}}
    needs:
      - cadrage
    inputs:
      - name: cadrage
        from: cadrage.summary
        type: acp.analysis/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: analysis
      type: acp.analysis/v1
      format: markdown

  - id: analyse_technique
    agent: Codex CLI
    prompt: |
      Analyse le use case cote technique.
      Ne modifie aucun fichier.

      Retourne :
      - composants probablement concernes
      - risques d'integration
      - validations a prevoir

      Demande utilisateur :
      {{userPrompt}}

      Cadrage :
      {{inputs.cadrage}}
    needs:
      - cadrage
    inputs:
      - name: cadrage
        from: cadrage.summary
        type: acp.analysis/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: analysis
      type: acp.analysis/v1
      format: markdown

  - id: synthese
    agent: Codex CLI
    prompt: |
      Produit une synthese actionnable a partir des analyses lancees en parallele.

      Structure la reponse avec :
      - decision recommandee
      - plan d'execution
      - criteres de test

      Demande utilisateur :
      {{userPrompt}}

      Analyse produit :
      {{inputs.produit}}

      Analyse technique :
      {{inputs.technique}}
    needs:
      - analyse_produit
      - analyse_technique
    inputs:
      - name: produit
        from: analyse_produit.analysis
        type: acp.analysis/v1
        format: markdown
      - name: technique
        from: analyse_technique.analysis
        type: acp.analysis/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: synthesis
      type: acp.analysis/v1
      format: markdown
