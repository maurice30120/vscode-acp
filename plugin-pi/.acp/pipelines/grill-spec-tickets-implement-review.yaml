version: 3
id: grill-spec-tickets-implement-review
title: Grill → Spec → Tickets → Implement → Review

nodes:
  - id: plan
    agent: Pi Agent
    skills:
      - grill-me
      - grilling
    promptFile: .acp/agents/interactive-planner.md
    prompt: |
      The upstream sources are `.agents/skills/grill-me/SKILL.md` and
      `.agents/skills/grilling/SKILL.md`. Read them when available. The rules in
      this prompt and the planner prompt file form a complete ACP-safe contract
      when those workspace files are absent.

      Resolve one user decision at a time. Include a recommended answer with a
      short justification. Inspect the workspace for facts instead of asking
      about them. Preserve all confirmed decisions. Do not proceed to
      specification until every material question is answered and the plan is
      decision-complete. Never modify files during planning.

      User request:
      {{userPrompt}}
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: plan
      type: acp.grill-decision/v1
      format: markdown

  - id: plan_approval
    type: pause
    pause: approval
    content: "{{inputs.plan}}"
    format: proposed-plan
    needs:
      - plan
    inputs:
      - name: plan
        from: plan.plan
        type: acp.grill-decision/v1
        format: markdown
    output:
      name: approved
      type: acp.grill-decision/v1
      format: markdown

  - id: spec
    agent: Pi Agent
    skills:
      - to-spec
    promptFile: .acp/agents/matt-spec-writer.md
    prompt: |
      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}

      Synthesize the approved conversation into the complete specification now.
    needs:
      - plan_approval
    inputs:
      - name: approvedPlan
        from: plan_approval.approved
        type: acp.grill-decision/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: specification
      type: acp.specification/v1
      format: markdown

  - id: tasks
    agent: Pi Agent
    skills:
      - to-tickets
    promptFile: .acp/agents/matt-ticket-planner.md
    prompt: |
      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}

      Specification:
      {{inputs.specification}}

      Produce the ordered tracer-bullet task plan now.
    needs:
      - spec
    inputs:
      - name: approvedPlan
        from: plan_approval.approved
        type: acp.grill-decision/v1
        format: markdown
      - name: specification
        from: spec.specification
        type: acp.specification/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: tickets
      type: acp.ticket-graph/v1
      format: markdown

  - id: delivery_approval
    type: pause
    pause: approval
    content: |
      <proposed_plan>
      <interview_state>ready</interview_state>

      ## Specification

      {{inputs.specification}}

      ## Task plan

      {{inputs.tickets}}
      </proposed_plan>
    format: proposed-plan
    needs:
      - tasks
    inputs:
      - name: specification
        from: spec.specification
        type: acp.specification/v1
        format: markdown
      - name: tickets
        from: tasks.tickets
        type: acp.ticket-graph/v1
        format: markdown
    output:
      name: approved
      type: acp.ticket-graph/v1
      format: markdown

  - id: implementation
    agent: Vibe Sandcastle
    skills:
      - implement
      - tdd
    promptFile: .acp/agents/matt-implementer.md
    prompt: |
      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}

      Approved specification:
      {{inputs.specification}}

      Approved task plan:
      {{inputs.approvedTickets}}

      Implement the complete approved task plan in dependency order.
    needs:
      - delivery_approval
    inputs:
      - name: approvedPlan
        from: plan_approval.approved
        type: acp.grill-decision/v1
        format: markdown
      - name: specification
        from: spec.specification
        type: acp.specification/v1
        format: markdown
      - name: approvedTickets
        from: delivery_approval.approved
        type: acp.ticket-graph/v1
        format: markdown
    policy:
      filesystem: workspace-write
      terminal: workspace-write
      network: disabled
      promotion: ask
    output:
      name: result
      type: acp.implementation-result/v1
      format: markdown

  - id: review
    agent: Pi Agent
    skills:
      - code-review
    promptFile: .acp/agents/matt-plan-reviewer.md
    prompt: |
      Original request:
      {{userPrompt}}

      Approved plan:
      {{inputs.approvedPlan}}

      Approved specification:
      {{inputs.specification}}

      Approved task plan:
      {{inputs.approvedTickets}}

      Implementation report:
      {{inputs.implementation}}

      Review the actual workspace diff against the plan, specification, tasks,
      repository standards, and test results.
    needs:
      - implementation
    inputs:
      - name: approvedPlan
        from: plan_approval.approved
        type: acp.grill-decision/v1
        format: markdown
      - name: specification
        from: spec.specification
        type: acp.specification/v1
        format: markdown
      - name: approvedTickets
        from: delivery_approval.approved
        type: acp.ticket-graph/v1
        format: markdown
      - name: implementation
        from: implementation.result
        type: acp.implementation-result/v1
        format: markdown
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: report
      type: acp.verification-report/v1
      format: markdown
