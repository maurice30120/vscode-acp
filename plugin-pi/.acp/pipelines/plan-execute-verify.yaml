version: 2
id: plan-execute-verify
title: Plan Execute Verify

primitives:
  planner:
    agent: Pi Agent
    output: proposed_plan
    sideEffects: none
    permissions: allowAll
    promptFile: ../agents/planner.md
    prompt: |
      Create a decision-complete implementation plan only.
      Return exactly one <proposed_plan>...</proposed_plan> block.
      Include likely code areas to change (file paths, modules, or search targets),
      concrete implementation steps, validation commands, and acceptance criteria.

      User request:
      {{userPrompt}}

  implementer:
    agent: Vibe Sandcastle
    output: markdown
    sideEffects: workspace
    permissions: allowAll
    promptFile: ../agents/implementer.md
    prompt: |
      Implement the approved plan in the current workspace.
      Make the required workspace changes; do not stop after inventory or analysis.
      If implementation is impossible, explain the blocker and name the files or missing facts.
      Before finishing, inspect the diff and summarize changed files plus validation run.

      Original request:
      {{userPrompt}}

      Approved plan:
      {{steps.approval.output}}

  verifier:
    agent: Vibe
    output: markdown
    sideEffects: none
    permissions: allowAll
    promptFile: ../agents/reviewer.md
    prompt: |
      Verify whether the approved plan was completed.
      Include changed files, tests, risks, and remaining gaps.

      Original request:
      {{userPrompt}}

      Approved plan:
      {{steps.approval.output}}

      Implementation output:
      {{steps.implement.output}}

steps:
  - id: plan
    use: planner

  - id: approval
    type: approval
    input: "{{steps.plan.output}}"

  - id: implement
    use: implementer

  - id: verify
    use: verifier
