version: 3
id: vibe
title: Vibe

nodes:
  - id: implement
    agent: Vibe
    prompt: |
      Implement the user's request in the current workspace.

      User request:
      {{userPrompt}}
    policy:
      filesystem: read-only
      terminal: none
      network: disabled
      promotion: discard
    output:
      name: result
      type: acp.implementation-result/v1
      format: markdown
