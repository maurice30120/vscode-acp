version: 2
id: async-use-case-review
title: Async Use Case Review

primitives:
  cadrage:
    agent: Codex CLI
    output: markdown
    sideEffects: none
    prompt: |
      Resume la demande utilisateur en trois points courts :
      - objectif
      - contraintes explicites
      - livrable attendu

      Demande utilisateur :
      {{userPrompt}}

  analyse_produit:
    agent: Codex CLI
    output: markdown
    sideEffects: none
    prompt: |
      Analyse le use case cote produit.
      Ne modifie aucun fichier.

      Retourne :
      - valeur utilisateur
      - workflow cible
      - questions ouvertes

      Demande utilisateur :
      {{userPrompt}}

      Cadrage :
      {{steps.cadrage.output}}

  analyse_technique:
    agent: Codex CLI
    output: markdown
    sideEffects: none
    prompt: |
      Analyse le use case cote technique.
      Ne modifie aucun fichier.

      Retourne :
      - composants probablement concernes
      - risques d'integration
      - validations a prevoir

      Demande utilisateur :
      {{userPrompt}}

      Cadrage :
      {{steps.cadrage.output}}

  synthese:
    agent: Codex CLI
    output: markdown
    sideEffects: none
    prompt: |
      Produit une synthese actionnable a partir des analyses lancees en parallele.

      Structure la reponse avec :
      - decision recommandee
      - plan d'execution
      - criteres de test

      Demande utilisateur :
      {{userPrompt}}

      Analyse produit :
      {{steps.investigation.branches.produit.output}}

      Analyse technique :
      {{steps.investigation.branches.technique.output}}

steps:
  - id: cadrage
    use: cadrage

  - id: investigation
    type: parallel
    branches:
      - id: produit
        use: analyse_produit
      - id: technique
        use: analyse_technique

  - id: synthese
    use: synthese
